apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontendingress
  annotations:
   nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: frontend.server.com
    http:
      paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: frontend
              port:
                number: 80
